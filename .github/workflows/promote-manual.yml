# Manual promotion — run on demand, pick a single "from -> to" step.
#
# Keep this file on the DEFAULT branch: GitHub only shows the "Run workflow"
# button for workflows present on the default branch, and dispatch reads the
# workflow definition from the ref you pick there.
name: Promote workflows (manual)

on:
  workflow_dispatch:
    inputs:
      promotion:
        description: Promotion step
        required: true
        type: choice
        options:
          - dev -> staging
          - staging -> production

jobs:
  promote:
    runs-on: ubuntu-latest
    # Derive the target environment from the single dropdown.
    environment: ${{ inputs.promotion == 'staging -> production' && 'production' || 'staging' }}
    steps:
      - name: Checkout tooling (default branch)
        uses: actions/checkout@v4

      - name: Checkout workflows from source branch
        uses: actions/checkout@v4
        with:
          # Derive the source branch from the same dropdown.
          ref: ${{ inputs.promotion == 'staging -> production' && 'staging' || 'dev' }}
          path: src

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build .n8np from the source branch's committed workflows
        run: |
          npm i tar@^7 --no-save
          node scripts/build-n8np.mjs src/workflows out.n8np
        env:
          SOURCE_ID: ${{ github.repository }}
          SOURCE_VERSION: manual

      - name: Import into target instance (working zone, not published)
        run: |
          npx -y @n8n/cli@beta package import \
            -u "$N8N_URL" -k "$N8N_API_KEY" \
            --file out.n8np \
            --conflict-policy=new-version \
            --workflow-id-policy=source \
            --credential-missing-mode=create-stub
        env:
          # Scoped to the selected environment (staging or production).
          N8N_URL: ${{ secrets.N8N_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
